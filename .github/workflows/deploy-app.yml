# .github/workflows/deploy-app.yml
name: Deploy App to Verify Instance
on:
  repository_dispatch:
    types: [app-image-published]
  workflow_dispatch: {}   # 方便你手動測試,不用等 platform-app 真的 push

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # 沿用既有的 gha_apply 信任範圍,不用新增任何 AWS 角色
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::029099141993:role/platform-gha-apply
          aws-region: ap-northeast-1

      - name: 依標籤查詢驗證機的 instance id
        id: instance
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=platform-verify" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "找不到執行中的 platform-verify 實例,任務 7 的 EC2 建了嗎?"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: 透過 SSM 拉最新映像、重啟容器(public package,不用 docker login)
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "docker pull ghcr.io/a4225344a/platform-service:latest",
              "docker stop platform-service || true",
              "docker rm platform-service || true",
              "docker run -d --name platform-service -p 8080:8080 --restart unless-stopped ghcr.io/a4225344a/platform-service:latest"
            ]' \
            --query "Command.CommandId" --output text)
          for i in $(seq 1 20); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ steps.instance.outputs.id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "第 $i 次查詢,狀態:$STATUS"
            [ "$STATUS" = "Success" ] && exit 0
            [ "$STATUS" = "Failed" ] && { echo "查 AWS 主控台 Systems Manager → Run Command 看詳細輸出"; exit 1; }
          done
          exit 1