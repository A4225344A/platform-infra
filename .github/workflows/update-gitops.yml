# .github/workflows/update-gitops.yml
name: Update GitOps manifest with new digest
on:
  repository_dispatch:
    types: [app-image-published]

permissions:
  contents: read

jobs:
  update-gitops:
    runs-on: ubuntu-latest
    steps:
      - name: Update GitOps manifest
        env:
          DIGEST: ${{ github.event.client_payload.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "沒收到 digest(event payload 缺 client_payload.digest),跳過"
            exit 1
          fi

          # GITOPS_REPO 沒設 repo variable 時,預設用同一個 GitHub 帳號底下的
          # platform-gitops(跟這份 repo 同 owner),讓 fork 的人不用先設變數就能跑。
          git clone "https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${{ vars.GITOPS_REPO || format('{0}/platform-gitops', github.repository_owner) }}.git"
          cd platform-gitops
          # ⚠️ 必要:runner 的 git 沒有預設身分,少了這兩行 git commit 會直接失敗
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 在 shell 端把完整映像位址組好,再讓 yq 只做「單純賦值」——
          # 不要在 yq 表達式裡用 "字面字串" + env(...) 拼接(yq 對字串相加有已知限制,
          # 會報 "Scalars not yet supported for addition"),也避開 Bash 單雙引號交錯轉義。
          IMAGE="ghcr.io/${{ vars.GHCR_OWNER }}/${{ vars.SERVICE_NAME || 'platform-service' }}@${DIGEST}"

          # 五支服務共用同一個映像(W2 任務 7),每個 apps/*-api.yaml 都是
          # Deployment+Service+HTTPRoute 三份文件的多文件 YAML。
          # ⚠️ 必要:select(di==0) 只挑第一份文件(Deployment)——yq -i 預設對
          # 檔案裡「每一份」文件套用同一個表達式,Service/HTTPRoute 沒有
          # spec.template.spec.containers 這個路徑,少了 select 會被 yq 自動
          # 建立出一段不存在的假欄位,汙染 Service/HTTPRoute manifest。
          for f in apps/*-api.yaml; do
            IMAGE="$IMAGE" yq -i '(select(di == 0) | .spec.template.spec.containers[0].image) = strenv(IMAGE)' "$f"
          done

          # 若 digest 沒變(例如重跑同一次 build),沒有差異時 commit 會回非零而讓 job 紅燈,
          # 這裡明確視為正常情況跳過
          git diff --quiet && echo "digest 未變更,跳過" && exit 0
          git commit -am "deploy ${DIGEST}"
          git push
