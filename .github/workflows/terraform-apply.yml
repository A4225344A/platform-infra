name: Terraform Apply
on:
  push:
    branches: [main]
    paths: ["modules/**", "*.tf"]
  workflow_dispatch:
    inputs:
      tf_targets:
        description: "Optional Terraform target addresses, separated by spaces, commas, or new lines."
        required: false
        default: ""
        type: string
      rebuild_compute:
        description: "Replace the control instance for recovery (deletes its root disk; does not replace existing workers)."
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GHA_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init
      - name: Build Terraform target args
        env:
          TF_TARGETS: ${{ github.event.inputs.tf_targets || '' }}
          REBUILD_COMPUTE: ${{ github.event.inputs.rebuild_compute || 'false' }}
        run: |
          python - <<'PY' > tf-target-args.txt
          import os
          import re

          targets = [
              value.strip()
              for value in re.split(r"[\s,]+", os.environ.get("TF_TARGETS", ""))
              if value.strip()
          ]
          for target in targets:
              if not re.fullmatch(r"[A-Za-z0-9_.\-[\]\"/]+", target):
                  raise SystemExit(f"invalid terraform target: {target}")
              print(f"-target={target}")
          if os.environ.get("REBUILD_COMPUTE") == "true":
              print("-replace=module.infra.aws_instance.control")
          PY
      - name: Terraform plan
        run: |
          mapfile -t TARGET_ARGS < tf-target-args.txt
          terraform plan -no-color -var="alert_email=${{ vars.ALERT_EMAIL }}" "${TARGET_ARGS[@]}" -out=tfplan
      - run: terraform apply -auto-approve tfplan
