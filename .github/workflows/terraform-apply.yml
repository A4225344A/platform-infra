name: Terraform Apply
on:
  push:
    branches: [main]
    paths: ["modules/**", "*.tf"]
  workflow_dispatch: {}   # GitHub 網頁上手動按按鈕觸發

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production   
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GHA_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init
      - run: terraform plan -no-color -var="alert_email=${{ vars.ALERT_EMAIL }}" -out=tfplan
      - run: terraform apply -auto-approve tfplan
