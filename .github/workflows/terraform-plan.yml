name: Terraform Plan
on:
  workflow_dispatch:
    inputs:
      tf_targets:
        description: "Optional Terraform target addresses, separated by spaces, commas, or new lines."
        required: false
        default: ""
        type: string
  pull_request:
    paths: ["modules/**", "*.tf"]

permissions:
  id-token: write   # OIDC 換證必須開這個權限
  contents: read
  pull-requests: write   # 把 plan 結果留言到 PR 上要用

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GHA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init
      - name: Build Terraform target args
        env:
          TF_TARGETS: ${{ github.event.inputs.tf_targets || '' }}
        run: |
          python - <<'PY' > tf-target-args.txt
          import os
          import re

          targets = [
              value.strip()
              for value in re.split(r"[\s,]+", os.environ.get("TF_TARGETS", ""))
              if value.strip()
          ]
          for target in targets:
              if not re.fullmatch(r"[A-Za-z0-9_.\-[\]\"/]+", target):
                  raise SystemExit(f"invalid terraform target: {target}")
              print(f"-target={target}")
          PY
      - name: Terraform plan
        run: |
          mapfile -t TARGET_ARGS < tf-target-args.txt
          terraform plan -no-color -var="alert_email=${{ vars.ALERT_EMAIL }}" "${TARGET_ARGS[@]}" | tee plan.txt
      - uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs')
            const full = fs.readFileSync('plan.txt', 'utf8')
            const truncated = full.length > 60000
            const plan = full.slice(0, 60000)
            const notice = truncated
              ? '\n\n⚠️ 輸出過長已截斷,完整內容請至 Actions 的 Run log 查看。'
              : ''
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `\`\`\`\n${plan}\n\`\`\`${notice}`
            })
